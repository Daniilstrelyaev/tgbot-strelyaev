name: Keep Render Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://tgbot-strelyaev.onrender.com/health)
          echo "Health: $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Service alive" || echo "⏳ Service waking up..."
